name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate demo data (fixed seed)
        run: python scripts/gen_data.py

      - name: Unit & e2e tests (mock LLM, no API key needed)
        run: python -m pytest -q

      - name: Evaluation benchmark (31 items, mock provider)
        run: python scripts/run_eval.py

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/report_*.md
