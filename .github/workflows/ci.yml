name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate demo data (fixed seed)
        run: python scripts/gen_data.py

      - name: Unit & e2e tests (mock LLM, no API key needed)
        run: python -m pytest -q

      - name: Dataset v2 gold self-check (compiler-generated, 116 items)
        run: python scripts/build_dataset_v2.py --check

      - name: Evaluation smoke (v1, 33 items, mock provider)
        run: python scripts/run_eval.py

      - name: Evaluation full (v2, 116 items, mock provider)
        run: python scripts/run_eval.py --dataset eval/dataset_v2.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/report_*.md

  # ── agenteval 回归门禁（评测平台跨项目集成）──────────────────────────────
  # 跑 agenteval 的 30 条 askbi smoke 评测（真 HTTP 打到本项目 mock 模式服务）
  # → gate 对比 agenteval 仓库内的基线 → 任一正确性指标劣化即 exit 1 挡合并。
  # mock 全链路零 key；前提：评测平台仓库已推送到同 owner 的 GitHub（agenteval，main 分支）。
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agenteval
          ref: main
          path: agenteval

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install askbi + agenteval dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ./agenteval

      - name: Generate demo data (fixed seed)
        run: python scripts/gen_data.py

      - name: Start askbi server (mock LLM, no API key)
        env:
          LLM_PROVIDER: mock
          PROFILE: conservative
        run: |
          python -m uvicorn app.api.main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/health >/dev/null

      - name: agenteval regression gate (askbi smoke 30, mock judge)
        env:
          GATE_OUT_DIR: ${{ github.workspace }}/.agenteval_gate
        run: |
          bash agenteval/scripts/ci_gate.sh askbi http://127.0.0.1:8000 \
            agenteval/baselines/askbi_smoke_baseline.json

      - name: Upload gate reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eval-gate-askbi
          path: .agenteval_gate/
          if-no-files-found: ignore
