# Render Blueprint：mock 零成本公开演示（DEPLOY.md 方案 A 的声明式版）
# 用法：Render 控制台 → New → Blueprint → 选本仓库 → Apply，环境变量/健康检查自动配置
services:
  - type: web
    name: askbi
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: mock
      # full 档演示：缓存徽章/多轮指代/澄清挂起全开（DEPLOY.md 推荐）
      - key: PROFILE
        value: full
